<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Battle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e10; color: #e9e6df;
               font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  /* текст — у самого верха: окно отправки Telegram выезжает снизу и закрывает середину */
  body { display: flex; align-items: flex-start; justify-content: center; text-align: center; }
  #box { padding: 20px 24px 0; max-width: 360px; }
  #big { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  #small { color: #9a968d; font-size: 15px; }
</style>
</head>
<body>
<div id="box"><div id="big"></div><div id="small"></div></div>
<script>
// Pocket Battle: окно Telegram «Поделиться сообщением». Бот заранее готовит
// сообщение (savePreparedInlineMessage) и передаёт его id в ссылке:
// ?id=…&lang=ru|en[&k=invite&b=1000&d=20|&k=win][&bot=имя_бота]
// k=invite — на фоне окна отправки бонус за друга, после отправки «✅ Отправлено»;
// k=win — «🏆 Поделись победой», после отправки «✅ Отправлено!»;
// старый Telegram или ошибка — ссылка t.me/бот?start=invitecard|wincard: бот
// пришлёт карточку-приглашение / победу для пересылки.
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var p = new URLSearchParams(location.search);
  var en = p.get("lang") === "en";
  var invite = p.get("k") === "invite";
  var win = p.get("k") === "win";
  var bot = (p.get("bot") || "").replace(/[^A-Za-z0-9_]/g, "");
  function num(v) { return String(parseInt(v, 10) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, en ? "," : " "); }
  var bonus = (en ? "🎁 For a friend: " : "🎁 За друга: ") + num(p.get("b")) + " 💵 + " + num(p.get("d")) + " 💎";
  var T = {
    pick: en ? "when they create a fighter" : "когда он создаст бойца",
    sent: en ? "✅ Invite sent!" : "✅ Приглашение отправлено!",
    winTop: en ? "🏆 Share your victory with friends" : "🏆 Поделись победой с друзьями",
    winSent: en ? "✅ Sent!" : "✅ Отправлено!",
    sentSmall: en ? "Your bonus arrives when your friend creates a fighter"
                  : "Бонус придёт, когда друг создаст бойца",
    old: en ? "Update Telegram to share from here." : "Обнови Telegram, чтобы делиться отсюда.",
    expired: en ? "This button is outdated. Open the screen again and tap it once more."
                : "Кнопка устарела. Открой экран заново и нажми ещё раз.",
    fail: en ? "Couldn't open sharing. Try again." : "Не получилось открыть отправку. Попробуй ещё раз."
  };
  function show(big, small) {
    document.getElementById("big").textContent = big || "";
    document.getElementById("small").textContent = small || "";
  }
  if (invite) show(bonus, T.pick);
  if (win) show(T.winTop);
  if (!tg) { show(T.old); return; }
  tg.ready();
  try { tg.expand(); tg.setHeaderColor("#0e0e10"); tg.setBackgroundColor("#0e0e10"); } catch (e) {}
  function close() { try { tg.close(); } catch (e) {} }
  function fallback(text) {
    // приглашение: бот пришлёт карточку для пересылки; иначе — просто сообщение
    if ((invite || win) && bot && tg.openTelegramLink) {
      try { tg.openTelegramLink("https://t.me/" + bot + "?start=" + (invite ? "invitecard" : "wincard")); } catch (e) {}
      setTimeout(close, 300);
      return;
    }
    try { tg.showAlert(text, close); } catch (e) { close(); }
  }
  var id = p.get("id");
  if (!id || typeof tg.shareMessage !== "function" || !tg.isVersionAtLeast || !tg.isVersionAtLeast("8.0")) {
    fallback(T.old); return;
  }
  tg.onEvent("shareMessageFailed", function (e) {
    var err = e && e.error;
    if (err === "USER_DECLINED") { close(); return; }
    fallback(err === "MESSAGE_EXPIRED" ? T.expired : T.fail);
  });
  tg.shareMessage(id, function (sent) {
    if (!sent) return;  // отказ/ошибка — через shareMessageFailed
    if (invite) { show(T.sent, T.sentSmall); setTimeout(close, 1500); }
    else if (win) { show(T.winSent); setTimeout(close, 1200); }
    else close();
  });
})();
</script>
</body>
</html>
